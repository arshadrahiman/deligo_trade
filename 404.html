    <!-- Instant Theme Initialization (System Default / Anti-Flicker) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('delitrade_theme_mode_v1') || 'system';
          var isDark = saved === 'dark' || (saved === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
            root.setAttribute('data-theme', 'dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.add('light');
            root.classList.remove('dark');
            root.setAttribute('data-theme', 'light');
            root.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <!-- Prevent Pinch-to-Zoom on touch devices -->
    <script>
      (function() {
        // Prevent multi-touch gesture zooming (iOS Safari)
        document.addEventListener('gesturestart', function(e) {
          e.preventDefault();
        }, { passive: false });
        document.addEventListener('gesturechange', function(e) {
          e.preventDefault();
        }, { passive: false });
        document.addEventListener('gestureend', function(e) {
          e.preventDefault();
        }, { passive: false });

        // Prevent multi-touch pinch on touchstart
        document.addEventListener('touchstart', function(e) {
          if (e.touches.length > 1) {
            e.preventDefault();
          }
        }, { passive: false });

        // Prevent double-tap to zoom
        var lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
          var now = Date.now();
          if (now - lastTouchEnd <= 300) {
            e.preventDefault();
          }
          lastTouchEnd = now;
        }, { passive: false });
      })();
    </script>
