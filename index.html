<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/whatsapp.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Delitrade - The Warehouse Gym & Equipment Supply</title>
    <!-- Prevent Pinch-to-Zoom on touch devices -->
    <script>
      (function() {
        // Prevent multi-touch gesture zooming (iOS Safari)
        document.addEventListener('gesturestart', function(e) {
          e.preventDefault();
        }, { passive: false });
        document.addEventListener('gesturechange', function(e) {
          e.preventDefault();
        }, { passive: false });
        document.addEventListener('gestureend', function(e) {
          e.preventDefault();
        }, { passive: false });

        // Prevent multi-touch pinch on touchstart
        document.addEventListener('touchstart', function(e) {
          if (e.touches.length > 1) {
            e.preventDefault();
          }
        }, { passive: false });

        // Prevent double-tap to zoom
        var lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
          var now = Date.now();
          if (now - lastTouchEnd <= 300) {
            e.preventDefault();
          }
          lastTouchEnd = now;
        }, { passive: false });
      })();
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#07090E] text-slate-100 antialiased selection:bg-[#FED430] selection:text-black min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
